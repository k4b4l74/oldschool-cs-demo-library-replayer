# Runs on every push to main and every pull request.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tests and build (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Archive tools (bsdtar and 7-Zip, as on Windows)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools p7zip-full
      - name: python3 tasks.py check
        run: python3 tasks.py check

  windows:
    name: Backend tests (Windows)
    runs-on: windows-2025
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --extra desktop
      - run: uv run pytest
