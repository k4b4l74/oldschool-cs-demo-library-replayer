name: Bug report
description: Something in the app does not work as expected.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Top right of the app (for example v1.0.0).
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: App log
      description: The end of `%LOCALAPPDATA%\OldschoolCSDemos\logs\app.log`, if it shows an error.
      render: text
